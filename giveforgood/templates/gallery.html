{% extends "base.html" %}

{% block content %}
<section class="section section-bg-light pt-nav" style="min-height: 100vh;">
    <div class="container">
        
        <header class="text-center" style="margin-bottom: 4rem;">
            <h1 class="section-title font-brand">Our Impact</h1>
            <p style="color: var(--text-secondary); font-size: 1.125rem;">Capturing moments of hope, awareness, and community impact.</p>
        </header>

        <div class="gallery-grid">
            {% for img_url in images %}
            <div>
                <a href="{{ img_url }}" data-fslightbox="gallery" class="gallery-item">
                    <img src="{{ img_url }}" alt="Event Image" class="gallery-img" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon-glass">
                            <i class="fas fa-search-plus"></i>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>

        <div class="text-center" style="margin-top: 6rem; margin-bottom: 3rem;">
            <h2 class="section-title font-brand text-center" style="margin-bottom: 1rem;">Financial Transparency</h2>
            <div style="height: 4px; width: 80px; background-color: var(--accent-primary); margin: 0 auto; border-radius: 9999px;"></div>
            <p style="color: var(--text-secondary); font-size: 1.125rem; margin-top: 1.5rem;">Verification of every contribution used for the cause.</p>
        </div>

        <div class="gallery-grid">
            {% for bill_url in bills %}
            <div>
                <a href="{{ bill_url }}" data-fslightbox="bills" class="gallery-item" style="border: 1px solid rgba(0,0,0,0.05);">
                    <img src="{{ bill_url }}" alt="Donation Bill" class="gallery-img" style="border-radius: 0.5rem; filter: grayscale(100%); transition: filter 0.5s ease;" loading="lazy">
                    <style>
                        .gallery-item:hover .gallery-img {
                            filter: grayscale(0%);
                        }
                    </style>
                </a>
            </div>
            {% endfor %}
        </div>

    </div>
</section>
{% endblock %}
